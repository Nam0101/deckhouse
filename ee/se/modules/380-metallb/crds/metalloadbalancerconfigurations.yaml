---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    module: metallb
    backup.deckhouse.io/cluster-config: "true"
  name: metalloadbalancerconfigurations.network.deckhouse.io
spec:
  group: network.deckhouse.io
  names:
    kind: MetalLoadBalancerConfiguration
    listKind: MetalLoadBalancerConfigurationList
    plural: metalloadbalancerconfigurations
    singular: metalloadbalancerconfiguration
    shortNames:
    - mlbconfig
  scope: Cluster
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: MetalLoadBalancerConfiguration is the Schema for the metalloadbalancerconfigurations API
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - mode
              properties:
                nodeSelector:
                  type: object
                  additionalProperties:
                    type: string
                  description: |-
                    Node selector for nodes that will announce the addresses.
                mode:
                  type: string
                  enum:
                    - BGP
                  description: |-
                    The routing mode. Only BGP is supported in this configuration.
                bgp:
                  type: object
                  properties:
                    peerNames:
                      type: array
                      items:
                        type: string
                  description: |-
                    BGP specific configuration.
                advertisements:
                  type: array
                  items:
                    type: object
                    properties:
                      poolNames:
                        type: array
                        items:
                          type: string
                      bgp:
                        type: object
                        properties:
                          communities:
                            type: array
                            items:
                              type: string
                          localPref:
                            type: integer
                          aggregationLength:
                            type: integer
                    required:
                      - poolNames
                  description: |-
                    List of advertisements and their configurations.
            status:
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}

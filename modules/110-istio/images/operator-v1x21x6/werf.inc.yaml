---
{{- $istioVersion := "1.21.6" }}
{{- $istioImageVersion := (printf "v%s" (replace "." "x" $istioVersion)) }} {{- /* 1.21.6 -> v1x21x6 */}}
# user and group id
{{- $UID := "64535" }}
{{- $GID := "64535" }}
---
# Based on https://github.com/istio/istio/blob/1.21.6/operator/docker/Dockerfile.operator
image: {{ .ModuleName }}/{{ .ImageName }}
fromImage: common/distroless
import:
- image: {{ .ModuleName }}/{{ .ImageName }}-build-artifact
  add: /src/istio/out/operator
  to: /usr/local/bin/operator
  owner: {{ $UID }}
  group: {{ $GID }}
  after: setup
- image: {{ .ModuleName }}/{{ .ImageName }}-build-artifact
  add: /src/istio/manifests
  to: /var/lib/istio/manifests
  after: setup
- image: tools/bash
  add: /usr/bin/bash
  to: /bin/bash
  before: setup
- image: tools/procps
  add: /bin/ps
  to: /bin/ps
  before: setup
- image: tools/coreutils
  add: /
  to: /
  includePaths:
  - usr/bin/*
  before: setup
imageSpec:
  config:
    user: {{ $UID }}:{{ $GID }}
    #workingDir: "/usr/local/bin"
    env: 
      PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    entrypoint: ["/usr/local/bin/operator"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-build-artifact
final: false
from: {{ index $.Images "builder/golang-alpine" }}
git:
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
import:
- image: {{ .ModuleName }}/common-{{ $istioImageVersion }}-src-artifact
  add: /src/istio
  to: /src/istio
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  beforeInstall:
  {{- include "alpine packages proxy" . | nindent 2 }}
  - apk add --no-cache bash git binutils
  install:
  - cd /src/istio/
  - git apply --verbose /patches/001-disable-cluster-scope-manifests.patch
  - echo {{ $istioVersion }} > version
  - export GOOS=linux GOARCH=amd64
  - export LDFLAGS='-extldflags -static -s -w'
  - GOPROXY=$(cat /run/secrets/GOPROXY) go mod download
  - common/scripts/gobuild.sh /src/istio/out/ -tags=agent,disable_pgv /src/istio/operator/cmd/operator/
  - strip /src/istio/out/operator
  - chmod 0700 /src/istio/out/operator
  - chown {{ $UID }}:{{ $GID }} /src/istio/out/operator
---
{{- include "vex mitigation" (list $ (printf "%s/%s" $.ModuleName $.ImageName)) }}
